services:
  api:
    build:
      context: .
      dockerfile: Race_Day/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "7173:8080"
    networks:
      - race-net

  mvc:
    build:
      context: .
      dockerfile: Race_Day.Mvc/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "7000:8080"
    depends_on:
      - api
    networks:
      - race-net

networks:
  race-net:
    driver: bridge
